ersonal CD</text><text x="46" y="504" fill="#c9c9d1" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="500" >library, even without a network connection.</text><rect x="46" y="636" width="1228" height="780" rx="30" fill="#12121a" stroke="#242431" stroke-width="2"/><text x="90" y="730" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" >Ready to start</text><text x="90" y="798" fill="#c9c9d1" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="600" >Local startup finished.</text><text x="90" y="928" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="800" >Scan your first CD</text><text x="90" y="1002" fill="#c9c9d1" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="500" >No account or invitation is required. Open</text><text x="90" y="1048" fill="#c9c9d1" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="500" >the scanner and start building your</text><text x="90" y="1094" fill="#c9c9d1" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="500" >personal music collection right away.</text><rect x="90" y="1220" width="1140" height="92" rx="28" fill="#5f162d" stroke="#5f162d" stroke-width="2"/><text x="660" y="1276" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle">Scan your CDs now</text><rect x="90" y="1344" width="1140" height="92" rx="28" fill="#171722" stroke="#2d2d3e" stroke-width="2"/><text x="660" y="1400" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle">Open library</text><text x="660" y="1506" fill="#f7e7b1" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">Save an optional local profile</text>
